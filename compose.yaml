name: metis

# Settings every Python service needs. Required secrets fail `docker compose up`
# before any container starts, with a message naming the missing variable.
# The app connects as the non-superuser `metis_app` role (RLS applies); only
# `migrate` uses the owner role. Migration 0004 gives `metis_app` its password.
x-app-settings: &app-settings
  DATABASE_URL: postgresql+asyncpg://metis_app:${APP_DB_PASSWORD:-metis_app}@postgres:5432/${POSTGRES_DB:-metis}
  REDIS_URL: redis://redis:6379/0
  AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-metis}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?is not set. Run `cp .env.example .env` and fill in AUTH_JWT_SECRET}
  ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?is not set. Run `cp .env.example .env` and fill in ENCRYPTION_MASTER_KEY}
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: metis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-metis}
    networks:
      - metis-network
    volumes:
      -  metis-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: metis-redis
    networks:
      - metis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: server
      dockerfile: Dockerfile
    container_name: metis-migrate
    command: ["alembic", "upgrade", "head"]
    networks:
      - metis-network
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-metis}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-metis_app}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: server
      dockerfile: Dockerfile
    container_name: metis-api
    command: ["uvicorn", "metis.entrypoints.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    networks:
      - metis-network
    environment:
      <<: *app-settings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: server
      dockerfile: Dockerfile
    container_name: metis-worker
    command: ["arq", "metis.entrypoints.worker.AgentWorkerSettings"]
    env_file:
      - path: .env
        required: false
    networks:
      - metis-network
    environment:
      <<: *app-settings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker-maintenance:
    build:
      context: server
      dockerfile: Dockerfile
    container_name: metis-worker-maintenance
    command: ["arq", "metis.entrypoints.worker.MaintenanceWorkerSettings"]
    env_file:
      - path: .env
        required: false
    networks:
      - metis-network
    environment:
      <<: *app-settings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    build:
      context: server
      dockerfile: Dockerfile
    container_name: metis-scheduler
    command: ["python", "-m", "metis.entrypoints.scheduler"]
    env_file:
      - path: .env
        required: false
    networks:
      - metis-network
    environment:
      <<: *app-settings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: web
      dockerfile: Dockerfile
    container_name: metis-web
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    networks:
      - metis-network
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000/v1
    depends_on:
      api:
        condition: service_started

volumes:
  metis-pgdata:
    name: metis-pgdata
    driver: local

networks:
  metis-network:
    name: metis-network
    driver: bridge
