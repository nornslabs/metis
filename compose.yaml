name: metis

x-app-settings: &app-settings
  DATABASE_URL: postgresql+asyncpg://metis_app:${APP_DB_PASSWORD:?is not set}@postgres:5432/${POSTGRES_DB:-metis}
  REDIS_URL: redis://redis:6379/0
  ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?is not set. Run `cp .env.example .env` and fill in ENCRYPTION_MASTER_KEY}
  AGENT_STUB_SPECIALISTS: ${AGENT_STUB_SPECIALISTS:-false}

x-server-base: &server-base
  build:
    context: server
    dockerfile: Dockerfile
  env_file:
    - path: .env
      required: false
  networks:
    - metis-network
  environment:
    <<: *app-settings
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: metis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?is not set}
      POSTGRES_DB: ${POSTGRES_DB:-metis}
    networks:
      - metis-network
    volumes:
      -  metis-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    container_name: metis-redis
    networks:
      - metis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: server
      dockerfile: Dockerfile
    container_name: metis-migrate
    command: ["alembic", "upgrade", "head"]
    networks:
      - metis-network
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?is not set}@postgres:5432/${POSTGRES_DB:-metis}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?is not set}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *server-base
    container_name: metis-api
    command: ["uvicorn", "metis.entrypoints.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *server-base
    command: ["arq", "metis.entrypoints.worker.AgentWorkerSettings"]

  worker-maintenance:
    <<: *server-base
    command: ["arq", "metis.entrypoints.worker.MaintenanceWorkerSettings"]

  scheduler:
    <<: *server-base
    command: ["python", "-m", "metis.entrypoints.scheduler"]

  web:
    build:
      context: web
      dockerfile: Dockerfile
      args:
        API_ORIGIN: http://api:8000
    container_name: metis-web
    ports:
      - "3000:3000"
    networks:
      - metis-network
    environment:
      API_ORIGIN: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  metis-pgdata:
    name: metis-pgdata
    driver: local

networks:
  metis-network:
    name: metis-network
    driver: bridge