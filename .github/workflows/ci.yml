name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      api_schema: ${{ steps.filter.outputs.api_schema }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            api_schema:
              - 'server/**'
              - 'web/lib/api/schema.d.ts'
              - 'web/package.json'
              - 'web/package-lock.json'
              - '.github/workflows/ci.yml'

  server-lint:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.server == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        working-directory: server
        run: uv sync

      - name: Ruff lint
        working-directory: server
        run: uv run ruff check .

      - name: Mypy type check
        working-directory: server
        run: uv run mypy

      - name: Import contracts
        working-directory: server
        run: uv run lint-imports

  api-schema:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.api_schema == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync server dependencies
        working-directory: server
        run: uv sync --no-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # The committed web/lib/api/schema.d.ts must match the server's OpenAPI schema.
      - name: Web API types are up to date
        working-directory: web
        run: |
          npm run gen:api
          git diff --exit-code -- lib/api/schema.d.ts

  server-test:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        working-directory: server
        run: uv sync

      - name: Database migrations
        working-directory: server
        run: uv run alembic upgrade heads
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/metis
          APP_DB_PASSWORD: metis_app

      - name: Pytest (shard ${{ matrix.shard }})
        working-directory: server
        run: |
          files=$(uv run python -c "import pathlib; files = sorted(str(p) for p in pathlib.Path('tests').rglob('test_*.py')); print(' '.join(files[${{ matrix.shard }}::4]))")
          uv run pytest $files
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/metis
          APP_DB_PASSWORD: metis_app
          REDIS_URL: redis://localhost:6379/0
          TEST_REDIS_URL: redis://localhost:6379/0

  server:
    runs-on: ubuntu-latest
    needs: [changes, server-lint, api-schema, server-test]
    if: always() && (github.event_name == 'push' || needs.changes.outputs.server == 'true' || needs.changes.outputs.api_schema == 'true')
    steps:
      - name: All server checks passed
        run: |
          for r in "${{ needs.server-lint.result }}" "${{ needs.api-schema.result }}" "${{ needs.server-test.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "Upstream server job ended with: $r"
              exit 1
            fi
          done

  web:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Unit tests
        working-directory: web
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.server == 'true' || needs.changes.outputs.web == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        if: github.event_name == 'push' || needs.changes.outputs.server == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: metis-server:test
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build web image
        if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          tags: metis-web:test
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  smoke:
    runs-on: ubuntu-latest
    needs: [changes, server, docker]
    if: github.event_name == 'push' || needs.changes.outputs.server == 'true'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          load: true
          tags: metis-server:test
          cache-from: type=gha,scope=server

      - name: Start API
        run: |
          # Host networking: service containers are published on the runner's localhost.
          # Secrets below are throwaway CI-only values (empty database, no real data).
          docker run -d --name metis-smoke \
            --network host \
            -e DATABASE_URL="postgresql+asyncpg://postgres:postgres@localhost:5432/metis" \
            -e REDIS_URL="redis://localhost:6379/0" \
            -e ENCRYPTION_MASTER_KEY="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
            metis-server:test \
            uvicorn metis.entrypoints.api:app --host 0.0.0.0 --port 8000

      - name: Health check
        run: |
          max_attempts=30
          for i in $(seq 1 "$max_attempts"); do
            if [ "$(docker inspect -f '{{.State.Running}}' metis-smoke)" != "true" ]; then
              echo "Container exited before becoming healthy"
              break
            fi
            response=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/health 2>/dev/null || true)
            if [ "$response" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/$max_attempts: health check returned $response, retrying..."
            sleep 1
          done
          echo "Health check failed"
          echo "=== Container logs ==="
          docker logs metis-smoke 2>&1 | tail -30
          exit 1

      - name: Stop API
        if: always()
        run: docker stop metis-smoke 2>/dev/null || true
