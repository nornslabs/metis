[project]
name = "metis"
version = "0.1.0"
description = "Metis - agentic planning app"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "redis",
  "arq",
  "structlog",
  "langgraph",
  "langchain-openai",
  "langgraph-checkpoint-postgres",
  "langchain-mcp-adapters",
  "cryptography>=50.0.2",
  "pyjwt>=2.15.1",
  "mcp>=1.30.0",
  "httpx>=0.28.1",
  "langfuse>=5.2.0",
  "psycopg[binary,pool]>=3.3.8",
  "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "import-linter>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "ASYNC",  # flake8-async
  "T201",   # print
  "C4",     # flake8-comprehensions
  "SIM",    # flake8-simplify
  "PIE",    # flake8-pie
  "ARG",    # flake8-unused-arguments
  "ERA",    # eradicate (commented code)
  "PL",     # pylint
  "TCH",    # type-checking
  "PTH",    # pathlib
  "RUF",    # ruff-specific
]
ignore = [
  "ARG001",   # unused function argument (common in callbacks)
  "ARG002",   # unused method argument (common in overrides)
  "TCH001",   # type checking import (used for runtime)
  "TCH002",   # type checking import (used for runtime)
  "PTH118",   # os.path vs pathlib (too aggressive)
  "PLR2004",  # magic value (too many HTTP status codes, etc.)
  "PLR0913",  # too many arguments (common in our API)
  "PLR0917",  # too many positional arguments
  "PLC0415",  # import at top-level (common in test fixtures)
  "PLR0911",  # too many return statements
  "RUF012",   # mutable class attribute (common in dataclasses)
  "RUF002",   # incomplete type annotation (some intentional)
  "PLW0603",  # global variable usage (some intentional)
  "RUF003",   # missing type annotation (some intentional)
  "PTH123",   # pathlib usage (some intentional)
  "PLR0911",  # too many return statements
  "SIM117",   # simplify (too aggressive)
  "RUF001",   # bare exception (some intentional)
  "PLW2901",  # global variable shadowing (some intentional)
  "PLW1510",  # possibly missing await (some intentional)
  "PLW0603",  # global variable usage
  "RUF003",   # missing type annotation
  "PTH123",   # pathlib usage
  "PLR0911",  # too many return statements
  "SIM117",   # simplify
  "RUF001",   # bare exception
  "PLW2901",  # global variable shadowing
  "PLW1510",  # possibly missing await
]

[tool.ruff.lint.isort]
known-first-party = ["metis"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",   # assert (common in tests)
  "T201",   # print (common in tests)
  "ARG001", # unused args in test fixtures
  "ARG002", # unused args in test fixtures
]
"migrations/**" = [
  "S101",   # assert
  "T201",   # print
]
"metis/core/outbox.py" = [
  "TC003",  # UUID import at runtime needed for SQLAlchemy/Pydantic
]
"metis/helpers/pricing.py" = [
  "TC003",  # Decimal import at runtime needed for Pydantic model
]
"metis/modules/auth/models/identities.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/auth/models/sessions.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/auth/models/users.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/ideas/models/ideas.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/ideas/models/interview.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/ideas/models/llm_usage.py" = [
  "TC003",  # datetime/Decimal import at runtime needed for SQLAlchemy
]
"metis/modules/ideas/models/specs.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/ideas/models/workflow_runs.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/identity/models/provider_keys.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/identity/models/settings.py" = [
  "TC003",  # datetime/Decimal import at runtime needed for SQLAlchemy
]
"metis/modules/identity/models/workspaces.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/integrations/models/connections.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/integrations/models/export_jobs.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/integrations/models/external_refs.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/planning/models/plans.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/planning/models/tasks.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/research/models/competitors.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/research/models/snapshots.py" = [
  "TC003",  # datetime/date/Decimal import at runtime needed for SQLAlchemy
]
"metis/modules/scoring/models/rubric.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/scoring/models/scores.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]
"metis/modules/scoring/models/suggestions.py" = [
  "TC003",  # datetime import at runtime needed for SQLAlchemy
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 80

[tool.mypy]
python_version = "3.12"
strict = true
files = ["metis", "evals"]

[tool.importlinter]
root_package = "metis"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core and helpers import no domain module"
type = "forbidden"
source_modules = ["metis.core", "metis.helpers"]
forbidden_modules = ["metis.modules"]

[[tool.importlinter.contracts]]
name = "only the LLM adapter imports the OpenAI client libraries"
type = "forbidden"
source_modules = [
  "metis.core",
  "metis.helpers",
  "metis.agent",
  "metis.modules",
  "metis.entrypoints",
  "metis.adapters.mcp",
]
# Direct imports only: modules reach the adapter through its own package on purpose.
allow_indirect_imports = true
forbidden_modules = ["langchain_openai", "openai"]

[[tool.importlinter.contracts]]
name = "auth imports no other domain module"
type = "forbidden"
source_modules = ["metis.modules.auth"]
# List every sibling module explicitly: forbidding the parent "metis.modules"
# does not catch imports from a source that lives inside it. Add new modules here.
forbidden_modules = [
  "metis.modules.identity",
  "metis.modules.ideas",
  "metis.modules.health",
  "metis.modules.research",
  "metis.modules.scoring",
  "metis.modules.planning",
  "metis.modules.integrations",
]

[[tool.importlinter.contracts]]
name = "research, scoring, planning and integrations sit above ideas, ideas above identity, identity above auth"
type = "layers"
layers = [
  "metis.modules.research | metis.modules.scoring | metis.modules.planning | metis.modules.integrations",
  "metis.modules.ideas",
  "metis.modules.identity",
  "metis.modules.auth",
]

[[tool.importlinter.contracts]]
name = "identity uses only auth's public surface"
type = "forbidden"
source_modules = ["metis.modules.identity"]
# Only what `metis.modules.auth` exports is public: never its layers. Indirect chains
# through auth's own `__init__` are fine, so only direct imports are checked.
forbidden_modules = [
  "metis.modules.auth.cache",
  "metis.modules.auth.controller",
  "metis.modules.auth.dto",
  "metis.modules.auth.models",
  "metis.modules.auth.repo",
  "metis.modules.auth.service",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ideas uses only identity's and auth's public surface"
type = "forbidden"
source_modules = ["metis.modules.ideas"]
forbidden_modules = [
  "metis.modules.identity.controller",
  "metis.modules.identity.dto",
  "metis.modules.identity.helpers",
  "metis.modules.identity.models",
  "metis.modules.identity.repo",
  "metis.modules.identity.service",
  "metis.modules.auth.cache",
  "metis.modules.auth.controller",
  "metis.modules.auth.dto",
  "metis.modules.auth.models",
  "metis.modules.auth.repo",
  "metis.modules.auth.service",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "research uses only the public surface of ideas, identity and auth"
type = "forbidden"
source_modules = ["metis.modules.research"]
forbidden_modules = [
  "metis.modules.ideas.controller",
  "metis.modules.ideas.dto",
  "metis.modules.ideas.helpers",
  "metis.modules.ideas.models",
  "metis.modules.ideas.repo",
  "metis.modules.ideas.service",
  "metis.modules.identity.controller",
  "metis.modules.identity.dto",
  "metis.modules.identity.helpers",
  "metis.modules.identity.models",
  "metis.modules.identity.repo",
  "metis.modules.identity.service",
  "metis.modules.auth.cache",
  "metis.modules.auth.controller",
  "metis.modules.auth.dto",
  "metis.modules.auth.models",
  "metis.modules.auth.repo",
  "metis.modules.auth.service",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "scoring uses only the public surface of ideas, identity and auth"
type = "forbidden"
source_modules = ["metis.modules.scoring"]
forbidden_modules = [
  "metis.modules.ideas.controller",
  "metis.modules.ideas.dto",
  "metis.modules.ideas.helpers",
  "metis.modules.ideas.models",
  "metis.modules.ideas.repo",
  "metis.modules.ideas.service",
