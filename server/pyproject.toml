[project]
name = "metis"
version = "0.1.0"
description = "Metis - agentic planning app"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "redis",
  "arq",
  "structlog",
  "langgraph",
  "langchain-openai",
  "langgraph-checkpoint-postgres",
  "langchain-mcp-adapters",
  "cryptography>=50.0.2",
  "pyjwt>=2.15.1",
  "mcp>=1.30.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "import-linter>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["metis"]

[tool.importlinter]
root_package = "metis"

[[tool.importlinter.contracts]]
name = "core and helpers import no domain module"
type = "forbidden"
source_modules = ["metis.core", "metis.helpers"]
forbidden_modules = ["metis.modules"]

[[tool.importlinter.contracts]]
name = "auth imports no other domain module"
type = "forbidden"
source_modules = ["metis.modules.auth"]
# List every sibling module explicitly: forbidding the parent "metis.modules"
# does not catch imports from a source that lives inside it. Add new modules here.
forbidden_modules = ["metis.modules.identity", "metis.modules.health"]

[[tool.importlinter.contracts]]
name = "identity sits above auth"
type = "layers"
layers = ["metis.modules.identity", "metis.modules.auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
