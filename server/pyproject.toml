[project]
name = "metis"
version = "0.1.0"
description = "Metis - agentic planning app"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "redis",
  "arq",
  "structlog",
  "langgraph",
  "langchain-openai",
  "langgraph-checkpoint-postgres",
  "langchain-mcp-adapters",
  "cryptography>=50.0.2",
  "pyjwt>=2.15.1",
  "mcp>=1.30.0",
  "httpx>=0.28.1",
  "langfuse>=5.2.0",
  "psycopg[binary,pool]>=3.3.8",
  "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "import-linter>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["metis"]

[tool.importlinter]
root_package = "metis"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core and helpers import no domain module"
type = "forbidden"
source_modules = ["metis.core", "metis.helpers"]
forbidden_modules = ["metis.modules"]

[[tool.importlinter.contracts]]
name = "only the LLM adapter imports the OpenAI client libraries"
type = "forbidden"
source_modules = [
  "metis.core",
  "metis.helpers",
  "metis.agent",
  "metis.modules",
  "metis.entrypoints",
  "metis.adapters.mcp",
]
# Direct imports only: modules reach the adapter through its own package on purpose.
allow_indirect_imports = true
forbidden_modules = ["langchain_openai", "openai"]

[[tool.importlinter.contracts]]
name = "auth imports no other domain module"
type = "forbidden"
source_modules = ["metis.modules.auth"]
# List every sibling module explicitly: forbidding the parent "metis.modules"
# does not catch imports from a source that lives inside it. Add new modules here.
forbidden_modules = [
  "metis.modules.identity",
  "metis.modules.ideas",
  "metis.modules.health",
  "metis.modules.research",
]

[[tool.importlinter.contracts]]
name = "research sits above ideas, ideas above identity, identity above auth"
type = "layers"
layers = [
  "metis.modules.research",
  "metis.modules.ideas",
  "metis.modules.identity",
  "metis.modules.auth",
]

[[tool.importlinter.contracts]]
name = "identity uses only auth's public surface"
type = "forbidden"
source_modules = ["metis.modules.identity"]
# Only what `metis.modules.auth` exports is public: never its layers. Indirect chains
# through auth's own `__init__` are fine, so only direct imports are checked.
forbidden_modules = [
  "metis.modules.auth.cache",
  "metis.modules.auth.controller",
  "metis.modules.auth.dto",
  "metis.modules.auth.models",
  "metis.modules.auth.repo",
  "metis.modules.auth.service",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ideas uses only identity's and auth's public surface"
type = "forbidden"
source_modules = ["metis.modules.ideas"]
forbidden_modules = [
  "metis.modules.identity.controller",
  "metis.modules.identity.dto",
  "metis.modules.identity.helpers",
  "metis.modules.identity.models",
  "metis.modules.identity.repo",
  "metis.modules.identity.service",
  "metis.modules.auth.cache",
  "metis.modules.auth.controller",
  "metis.modules.auth.dto",
  "metis.modules.auth.models",
  "metis.modules.auth.repo",
  "metis.modules.auth.service",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "research uses only the public surface of ideas, identity and auth"
type = "forbidden"
source_modules = ["metis.modules.research"]
forbidden_modules = [
  "metis.modules.ideas.controller",
  "metis.modules.ideas.dto",
  "metis.modules.ideas.helpers",
  "metis.modules.ideas.models",
  "metis.modules.ideas.repo",
  "metis.modules.ideas.service",
  "metis.modules.identity.controller",
  "metis.modules.identity.dto",
  "metis.modules.identity.helpers",
  "metis.modules.identity.models",
  "metis.modules.identity.repo",
  "metis.modules.identity.service",
  "metis.modules.auth.cache",
  "metis.modules.auth.controller",
  "metis.modules.auth.dto",
  "metis.modules.auth.models",
  "metis.modules.auth.repo",
  "metis.modules.auth.service",
]
allow_indirect_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
