  "metis.modules.auth.models",
  "metis.modules.auth.repo",
  "metis.modules.auth.service",
  "metis.modules.ideas",
]
allow_indirect_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]