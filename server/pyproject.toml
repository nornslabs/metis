allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "planning uses only the public surface of ideas, identity and auth"
type = "forbidden"
source_modules = ["metis.modules.planning"]
forbidden_modules = [
  "metis.modules.ideas.controller",
  "metis.modules.ideas.dto",
  "metis.modules.ideas.helpers",
  "metis.modules.ideas.models",
  "metis.modules.ideas.repo",
  "metis.modules.ideas.service",
  "metis.modules.identity.controller",
